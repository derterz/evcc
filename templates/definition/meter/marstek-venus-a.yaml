template: marstek-venus-a
covers: ["marstek-venus-d"]
products:
  - brand: Marstek
    description:
      generic: Venus A
  - brand: Marstek
    description:
      generic: Venus D
capabilities: ["battery-control"]
params:
  - name: usage
    choice: ["pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    id: 1
    baudrate: 115200
    comset: 8N1
  - preset: battery-params
  - name: capacity
    required: true
    help:
      de: Venus A 2.12 kWh, Venus D 2.56 kWh je Basisgerät und je Erweiterung
      en: Venus A 2.12 kWh, Venus D 2.56 kWh per base unit and per extension
  - name: minsoc
    default: 11
  - name: maxsoc
    default: 100
  - name: maxchargepower
    required: true
    help:
      de: Für erzwungenes Laden des Speichers. Venus A 1200 W, Venus D 2200 W
      en: For forced charging of the battery. Venus A 1200 W, Venus D 2200 W
  - name: maxdischargepower
    required: true
  - name: work_mode_normal
    default: 1
    advanced: true
    description:
      en: Work mode for Normal state
      de: Work mode für Normal-Modus
    help:
      en: 0=manual, 1=anti-feed, 2=trade mode, evcc=power set by evcc, balancing the soc with the other batteries.
      de: 0=manuell, 1=Eigenverbrauch, 2=AI-Optimierung, evcc=Leistung wird von evcc gesteuert und gleicht den Ladestand mit den anderen Speichern aus.
  - name: minpower
    type: int
    unit: W
    default: 100
    advanced: true
    description:
      en: Minimum power
      de: Mindestleistung
    help:
      en: Only with work mode evcc. Below this power the inverter is stopped to save its standby losses.
      de: Nur mit Work mode evcc. Unterhalb dieser Leistung wird der Wechselrichter gestoppt, um seinen Eigenverbrauch zu sparen.
render: |
  type: custom
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30037 # MPPT1 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30038 # MPPT2 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30039 # MPPT3 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30040 # MPPT4 power (W)
        type: holding
        decode: uint16
      scale: 0.1
  {{- end }}
  {{- if eq .usage "battery" }}
  # Register 30001 only covers the AC-side charge/discharge transaction and misses
  # solar that charges the battery straight from the MPPT inputs over the DC bus.
  # Battery power is therefore derived as AC power minus the device's own MPPT yield.
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30006 # AC power (W), positive = discharge
        type: holding
        decode: int16
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30037 # MPPT1 power (W)
        type: holding
        decode: uint16
      scale: -0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30038 # MPPT2 power (W)
        type: holding
        decode: uint16
      scale: -0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30039 # MPPT3 power (W)
        type: holding
        decode: uint16
      scale: -0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30040 # MPPT4 power (W)
        type: holding
        decode: uint16
      scale: -0.1
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 33002 # Total energy discharged from battery (kWh)
      type: holding
      decode: uint32
    scale: 0.01
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 32104 # Battery SOC (%)
      type: holding
      decode: uint16
  {{- if eq (toString .work_mode_normal) "evcc" }}
  chargePower:
    source: sequence
    set:
    # Enable RS485 Control Mode, also after a device restart
    - source: const
      value: 21930
      set:
        source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 42000 # RS485 Control Mode = Enabled
          type: writesingle
          decode: uint16
    - source: ifelse
      if:
        source: sequence
        set:
        - source: const
          value: 1
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 42010 # Force Charge/Discharge = Charge
              type: writesingle
              decode: uint16
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 42020 # Forcible Charge Power
            type: writesingle
            decode: uint16
      else:
        source: const
        value: 0
        set:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 42010 # Force Charge/Discharge = Stop
            type: writesingle
            decode: uint16
  dischargePower:
    source: sequence
    set:
    # Enable RS485 Control Mode, also after a device restart
    - source: const
      value: 21930
      set:
        source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 42000 # RS485 Control Mode = Enabled
          type: writesingle
          decode: uint16
    - source: ifelse
      if:
        source: sequence
        set:
        - source: const
          value: 2
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 42010 # Force Charge/Discharge = Discharge
              type: writesingle
              decode: uint16
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 42021 # Forcible Discharge Power
            type: writesingle
            decode: uint16
      else:
        source: const
        value: 0
        set:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 42010 # Force Charge/Discharge = Stop
            type: writesingle
            decode: uint16
  pvPower:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30037 # MPPT1 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30038 # MPPT2 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30039 # MPPT3 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30040 # MPPT4 power (W)
        type: holding
        decode: uint16
      scale: 0.1
  minPower: {{ .minpower }}
  {{- end }}
  {{- include "marstek-batterymode" . }}
  {{- include "battery-params" . }}
  {{- end }}
